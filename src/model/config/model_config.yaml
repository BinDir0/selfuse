# Model Server Configuration

# WebSocket服务器配置
server:
  host: "0.0.0.0"          # 服务器监听地址（0.0.0.0表示监听所有网络接口）
  port: 8765               # 服务器端口

# 模型配置
model:
  # 模型权重路径
  model_path: null         # 如果为null，则使用默认配置
  
  # 运行设备
  device: "cuda"           # 'cuda' 或 'cpu'
  
  # 模型类型
  type: "vla"              # Vision-Language-Action模型
  
  # 批处理大小
  batch_size: 1
  
  # 推理超时时间（秒）
  timeout: 5.0

# 输入配置
input:
  # 图像尺寸
  image_width: 640
  image_height: 480
  
  # 状态历史长度
  history_length: 10

# 输出配置
output:
  # 动作序列长度
  action_chunk_size: 50
  
  # 动作维度
  action_dim:
    left_hand: 20          # 左手关键点数量
    right_hand: 20         # 右手关键点数量
    left_arm: 7            # 左臂关节数量
    right_arm: 7           # 右臂关节数量

# 日志配置
logging:
  level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  save_to_file: false
  log_file: "model_server.log"

