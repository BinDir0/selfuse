# @package _global_
#
# WebDataset shard paths for VLA training.
#

wds_base_dir: /efs-exp/guantianrui/datasets/Webdataset
val_wds_base_dir: /efs-exp/guantianrui/datasets/Webdataset_val

# Shuffle buffer is shared after RandomMix, so subset count does not affect memory.
vla_wds_datasets:
  - name: taco_oakink_holoassist
    shard_urls:
      - ${wds_base_dir}/taco_train_filtered_v1/shard-*.tar
      - ${wds_base_dir}/oakink2_train_filtered_v1/shard-*.tar
      - ${wds_base_dir}/holoassist_filtered_v2_rechunked/shard-*.tar
    weight: 3
  - name: egodex
    shard_urls: ${wds_base_dir}/egodex_train_filtered_v2/shard-*.tar
    weight: 20
  - name: vitra
    shard_urls:
      - ${wds_base_dir}/epic_train_rechunked/shard-*.tar
      - ${wds_base_dir}/ego4d_cooking_and_cleaning_train_rechunked/shard-*.tar
      - ${wds_base_dir}/ego4d_other_train_rechunked/shard-*.tar
    weight: 15
  - name: buildai
    shard_urls: /efs-exp/yeyuyao/Webdataset/BuildAI-10K-0328-camera-corrected/shard-*.tar
    weight: 25
  - name: buildai-100k-part1
    shard_urls: /efs-exp/guantianrui/datasets/BuildAI-100K-part1-fully-rewritten-0425/shard-*.tar
    weight: 50
  - name: teleop_xiaozi
    shard_urls: /efs-exp/zengfanlian/datasets/Webdataset/real_world_with_breast_clip_v2/train/shard-*.tar
    weight: 10

val_vla_wds_datasets:
  - name: taco_test_seen
    shard_urls: ${val_wds_base_dir}/taco_test_seen/shard-*.tar
  - name: oakink2_test_seen_presence_clean
    shard_urls: ${val_wds_base_dir}/oakink2_test_seen_presence_clean/shard-*.tar
  - name: teleop_xiaozi_val
    shard_urls: /efs-exp/zengfanlian/datasets/Webdataset/real_world_with_breast_clip_v2/val/shard-*.tar
