# @package _global_
#
# WebDataset shard paths for VLA training.
#

wds_base_dir: /efs-exp/guantianrui/datasets/Webdataset
val_wds_base_dir: /efs-exp/guantianrui/datasets/Webdataset_val

# Shuffle buffer is shared after RandomMix, so subset count does not affect memory.
vla_wds_datasets:
  - name: taco_oakink_hot3d_h2o  # 10h
    shard_urls:
      - ${wds_base_dir}/taco_train_filtered_v1/shard-*.tar
      - ${wds_base_dir}/oakink2_train_filtered_v1/shard-*.tar
      - /efs-exp/guantianrui/datasets/hot3d/shard-*.tar
      - /efs-exp/guantianrui/datasets/H2O/shard-*.tar
    weight: 32
  - name: egoverse  # 690h
    shard_urls: /efs-exp/guantianrui/datasets/egoverse/*.tar
    weight: 263
  - name: holoassist  # 11.5h
    shard_urls: /efs-exp/guantianrui/datasets/Webdataset/holoassist_filtered_v2_rechunked/shard-*.tar
    weight: 27
  - name: egodex  # 370h
    shard_urls: /efs-exp/guantianrui/datasets/Webdataset/egodex_train_filtered_v2/shard-*.tar
    weight: 135
  - name: vitra  # 187h
    shard_urls:
      - ${wds_base_dir}/epic_train_rechunked/shard-*.tar
      - ${wds_base_dir}/ego4d_cooking_and_cleaning_train_rechunked/shard-*.tar
      - ${wds_base_dir}/ego4d_other_train_rechunked/shard-*.tar
    weight: 96
  - name: buildai  # 288h + 5000h + 3000h
    shard_urls: 
      - /efs-exp/yeyuyao/Webdataset/BuildAI-10K-0328-camera-corrected/shard-*.tar
      - /efs-exp/guantianrui/datasets/BuildAI-100K-part2-0427/shard-*.tar
      - /efs-exp/guantianrui/datasets/BuildAI-100K-part1-fully-rewritten-0425/shard-*.tar
    weight: 428

val_vla_wds_datasets:
  - name: taco_test_seen
    shard_urls: ${val_wds_base_dir}/taco_test_seen/shard-*.tar
  - name: oakink2_test_seen_presence_clean
    shard_urls: ${val_wds_base_dir}/oakink2_test_seen_presence_clean/shard-*.tar
