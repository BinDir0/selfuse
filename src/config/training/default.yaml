# @package _global_

flow:
  num_parallel_t: 4
  sig_min: 0.001
  sampling: beta
  alpha: 1.5
  beta: 1.0
  num_inference_steps: 10

training:
  steps_per_epoch: 100000
  seed: 42
  dynamic_data_seed: True
  objective: ${objective}
  debug: False
  profile: False 
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  train_vlm: True
  train_depth: False
  resume_checkpoint_path:
  finetune_checkpoint_path:
  normalizer_path: /share_data/zengfanlian/Projects/EgoVLA/outputs/normalizer/2026.03.16-relative-mixed/normalizer.pkl
  max_train_steps: null
  max_eval_steps: null
  num_epochs: 2
  use_bf16: True
  log_interval: 20
  eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
  save_eval_attn_weights: False
  eval_every: 5000
  checkpoint_every: 5000
  ckpt_save_interval: 10000
  clipping:
    enabled: True
    max_grad_norm: 1.0
  average:
    ema:
      enabled: False
      decay: 0.99
      start: 2000
      freq: 1
      device:
    swa:
      enabled: False
      start: 100000
      freq: 100000
      device:
  compile:
    enabled: True  # Set True to compile the fixed block stacks.
    fullgraph: False  # Start with False for dynamic multimodal training workloads.
    backend: inductor  # Default PyTorch compiler backend for CUDA workloads.
    mode: default  # Good starting point. Try reduce-overhead mainly for stable inference-like shapes.
    dynamic:  # Leave null for the PyTorch default. Set True only when variable shapes cause recompiles.
    vision: True  # Keep vision blocks on by default.
    text: True  # Keep text decoder blocks on by default.
    flow: True  # Keep action-expert blocks on by default.
    diffloss: True  # Keep diffloss blocks on by default.
  # Per-component gradient checkpointing. Set to plain `False` to disable all,
  # or `True` to enable all with every_n=1 (backward compatible).
  gradient_checkpointing:
    text:
      enabled: False
      every_n: 2           # checkpoint every N-th text layer (1 = all layers)
    vision:
      enabled: False
      every_n: 1           # checkpoint every N-th vision block (1 = all blocks)
    action_expert:
      enabled: False
      every_n: 1           # checkpoint every N-th action expert layer
optimizer:
  action:
    lr: 3e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2
  vlm:
    lr: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 5e-3
  diffloss:
    lr: 8e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2
