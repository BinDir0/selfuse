# 覆盖实验名称
name: legendvla_inference
exp_name: "inference_pretrain"

# 使用较小的数据集进行快速测试（可选）
vla_dataset_paths:
 - name: oakink2_test_seen
   path: /share_data/guantianrui/datasets/OakInk-v2/oakink2_test_seen_presence_clean.zarr 
#  - name: oakink2_test_unseen_scene
#    path: /share_data/guantianrui/datasets/OakInk-v2/oakink2_test_unseen_scene_presence_clean.zarr  
#  - name: oakink2_test_unseen_task
#    path: /share_data/guantianrui/datasets/OakInk-v2/oakink2_test_unseen_task_presence_clean.zarr
#  - name: egodex_test
#    path: /share_data/guantianrui/datasets/EgoDex/egodex_filter_test_presence_clean.zarr
#  - name: taco_test_seen
#    path: /share_data/guantianrui/datasets/taco/taco_test_seen.zarr
#  - name: taco_test_unseen_task
#    path: /share_data/guantianrui/datasets/taco/taco_test_unseen_task.zarr

# 覆盖dataloader配置（推理时不需要shuffle）
dataloader:
  batch_size: 64
  num_workers: 16
  shuffle: False
  pin_memory: True
  persistent_workers: False

# 禁用wandb日志
logging:
  mode: disabled

# 推理专用配置
inference:
  # 模型配置文件路径（yaml文件，包含policy配置）
  # 如果指定，将从该文件加载模型配置并初始化模型
  # 如果不指定，将使用当前配置中的policy配置
  model_config_path: /home/chenzhang/projects/EgoVLA/outputs/2026.01.24/13.58_legendvla_pretrain_legendvla_deepspeed/.hydra/config.yaml
  
  # checkpoint路径（用于加载模型权重）
  checkpoint_path: 
  
  # 设备配置
  device: cuda:0
  
  # 数据配置
  # Note: If val_ratio=0.0 in dataset config, all data is used regardless of this setting
  use_val_dataset: False  # True: 使用验证集（需要 val_ratio > 0）, False: 使用训练集或完整数据集
  
  # 推理控制
  max_steps: null  # 最大推理步数，null表示推理所有数据
  skip_first: 0  # 跳过前N个batch
  
  # 精度配置
  use_mixed_precision: True  # True: 使用混合精度（bf16/fp16）加速推理，False: 使用全精度（fp32）获得最高精度
                             # 注意：混合精度通常对结果影响很小（<1%），但能显著加速推理

  compile:  # torch.compile 配置
    enabled: True
    mode: "default" # "default", "reduce-overhead", "max-autotune"
    dynamic: True # 是否动态编译
    fullgraph: True # 是否使用全图编译
    backend: "inductor" # "inductor", "aot_eager", "aot_nvfuser", etc.
  
  # 其他配置
  seed: 42
  
hydra:
  job:
    override_dirname: ${name}
  run:
    # need to change to the correct path for multi-node training
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
