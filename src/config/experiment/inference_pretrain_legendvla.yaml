vlm_dataset_paths: 
 - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/objects365_qa_filtered"  # localization & grounding
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/spatialsense_filtered"  # spatialsense
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/alfworldgpt_filtered"  # high level subtask action

# 覆盖dataloader配置（推理时不需要shuffle）
dataloader:
  batch_size: 16
  num_workers: 16
  shuffle: True
  pin_memory: True
  persistent_workers: False

# 禁用wandb日志
logging:
  mode: disabled

tokenizer_padding: longest # longest or max_length
diffusion_sampling_steps: 100
diffusion_use_ddim_sampling: True
flow_sampling_steps: 10

# 推理专用配置
inference:
  # 推理模式: "ar" (autoregressive) or "flow" (flow matching) or "vlm" (text)
  mode: ar
  autoregressive_config: 
    max_new_tokens: 32
    temperature: 1.0
    top_k: 10
    top_p: 1.0
    eos_token_id: null # will be set by the vla_processor
    allowed_token_ids: null # will be set by the vla_processor
  # 模型配置文件路径（yaml文件，包含policy配置）
  # 如果指定，将从该文件加载模型配置并初始化模型
  # 如果不指定，将使用当前配置中的policy配置
  model_config_path: /home/chenzhang/projects/LegendVLA-train/outputs/2026.02.11/20.35_legendvla_pretrain_legendvla_deepspeed/.hydra/config.yaml
  
  # checkpoint路径（用于加载模型权重）
  checkpoint_path: /home/chenzhang/projects/LegendVLA-train/outputs/2026.02.11/20.35_legendvla_pretrain_legendvla_deepspeed/checkpoints/update_step=20000-eval_l1_loss=0.0286/pytorch_model/mp_rank_00_model_states.pt
  
  # 数据配置
  # Note: If val_ratio=0.0 in dataset config, all data is used regardless of this setting
  use_val_dataset: False  # True: 使用验证集（需要 val_ratio > 0）, False: 使用训练集或完整数据集
  
  # 推理控制
  max_steps: 1  # 最大推理步数，null表示推理所有数据
  skip_first: 0  # 跳过前N个batch
  save_zarr: True  # True: 保存zarr, False: 仅内存统计
  attention_sample_count: 4  # 随机保存 attention_maps 的样本数
  
  # 精度配置
  use_mixed_precision: True  # True: 使用混合精度（bf16/fp16）加速推理，False: 使用全精度（fp32）获得最高精度
                             # 注意：混合精度通常对结果影响很小（<1%），但能显著加速推理

  compile:  # torch.compile 配置
    enabled: False
    mode: "default" # "default", "reduce-overhead", "max-autotune"
    dynamic: True # 是否动态编译
    fullgraph: False # 是否使用全图编译
    backend: "inductor" # "inductor", "aot_eager", "aot_nvfuser", etc.
  
  # 其他配置
  seed: 42
  
hydra:
  job:
    override_dirname: ${name}
  run:
    # need to change to the correct path for multi-node training
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}
    subdir: ${hydra.job.num}
