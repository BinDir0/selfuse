# @package _global_

policy:
  _target_: src.policy.legendvla.LegendVLAInference
  model_config_path: /share_data/chenzhang/projects/LegendVLA-train/outputs/2026.02.09/21.04_legendvla_pretrain_legendvla_deepspeed/.hydra/config.yaml
  checkpoint_path: /share_data/chenzhang/projects/LegendVLA-train/outputs/2026.02.09/21.04_legendvla_pretrain_legendvla_deepspeed/checkpoints/update_step=35000-eval_l1_loss=0.0251/pytorch_model/mp_rank_00_model_states.pt
  mode: flow
  use_mixed_precision: true
  tokenizer_padding: longest
  diffusion_sampling_steps: null
  diffusion_use_ddim_sampling: false
  flow_sampling_steps: null
  default_instruction: null
  ar_temperature: 1.0
  ar_cfg: 1.0
  use_mlp_layer_norm: true

serving:
  host: 0.0.0.0
  port: 61234
  device: auto
  autocast: true
  warmup_enabled: true
  warmup_iters: 5
  warmup_instruction: grasp the yellow toy
  warmup_image_shape: [480, 640, 3]
  warmup_depth_shape: [480, 640, 1]
  warmup_intrinsic:
    - [388.0, 0.0, 320.0]
    - [0.0, 388.0, 240.0]
    - [0.0, 0.0, 1.0]
  log_obs_details: false
  record_enabled: false
  record_root_dir: outputs/serving_records

env_wrapper:
  enabled: true
  image_key: image
  depth_key: depth_image
  intrinsic_key: camera_intrinsics
  instruction_key: instruction
  states_key: states
