# @package _global_
defaults:
  - _self_

serving:
  host: "0.0.0.0"
  port: 8765
  device: cuda
  autocast: True
  warmup_enabled: True
  warmup_iters: 3
  warmup_instruction: "pick up the object"
  warmup_image_shape: [384, 384, 3]
  warmup_depth_shape: [384, 384, 3]
  warmup_intrinsic: [500.0, 500.0, 320.0, 240.0]
  log_obs_details: True
  record_enabled: True
  record_root_dir: outputs/serving_records
  profile_enabled: False
  profile_dir: outputs/serving_profile
  profile_steps: 20
  profile_skip_first: 5

# Inference policy wrapper
# model_config_path: path to the training run's .hydra/config.yaml
policy:
  _target_: src.policy.legendvla_inference_wrapper.LegendVLAInference
  model_config_path: /share_data/zengfanlian/Projects/EgoVLA/outputs/2026.04.24/22.34_legendvla_qwen3_vl_legendvla_qwen3_vl/.hydra/config.yaml  # required: path to the training run's .hydra/config.yaml
  checkpoint_path: "/share_data/zengfanlian/Projects/EgoVLA/outputs/2026.04.24/22.34_legendvla_qwen3_vl_legendvla_qwen3_vl/checkpoints/update_step=90000/"    # required: path to trained model checkpoint
  pretrained_vlm_path:   # override pretrained.model_name_or_path in model config (for backbone, action expert, tokenizer)
  teacher_path:   # override frozen_teacher.model_name_or_path (null = keep training config value)
  mode: flow
  use_mixed_precision: True
  tokenizer_padding: max_length
  max_length: 768
  default_instruction: null
  flow_sampling_steps: 10
  ar_max_new_tokens: null
  ar_temperature: 1.0
  ar_cfg: 1.0
  normalizer_path: /share_data/chenzhang/projects/diffloss-ar/outputs/normalizer/2026.03.31-relative-mixed/normalizer.pkl
  use_relative_action: True
  attention_recording: False
  compile:
    enabled: True
    fullgraph: False       # allow graph breaks in backbone multimodal processing
    backend: inductor
    mode: default 

env_wrapper:
  enabled: True
  # single: legacy single-camera payload
  # both: dual-camera payload, expects image/camera_intrinsics as dicts keyed by head/chest
  camera_setup_mode: both
  # rgb: ignore depth payload
  # rgbd: read depth payload using depth_key
  image_mode: rgb
  head_camera_name: head
  chest_camera_name: chest
  image_key: image
  depth_key: depth_image
  intrinsic_key: camera_intrinsics
  instruction_key: instruction
  states_key: states
  prev_action_chunk_key: action_rtc