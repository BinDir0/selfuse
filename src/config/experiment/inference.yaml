# @package _global_

policy:
  _target_: src.policy.legendvla.LegendVLAInference
  model_config_path: /home/psibot/checkpoints/legendvla/2026.03.09/diffloss-pretrain-multitask/.hydra/config.yaml
  checkpoint_path: /home/psibot/checkpoints/legendvla/2026.03.09/diffloss-pretrain-multitask/mp_rank_00_model_states.pt
  mode: flow
  use_mixed_precision: true
  tokenizer_padding: max_length
  max_length: 384
  diffusion_sampling_steps: null
  diffusion_use_ddim_sampling: false
  flow_sampling_steps: null
  default_instruction: null
  ar_temperature: 1.0
  ar_cfg: 1.0
  dinov2_repo_path: /home/psibot/projects/dinov2
  dinov2_model_path: /home/psibot/checkpoints/dinov2/dinov2_vitb14_reg4_pretrain.pth
  paligemma_model_path: /home/psibot/checkpoints/paligemma-3b-pt-224
  normalizer_path: /home/psibot/checkpoints/legendvla/normalizer.pkl
  use_relative_action: false
  compile:
    mode: reduce-overhead
    dynamic: null
    fullgraph: false
    backend: inductor

serving:
  host: 0.0.0.0
  port: 61234
  device: auto
  autocast: true
  warmup_enabled: true
  warmup_iters: 5
  warmup_instruction: grasp the yellow toy
  warmup_image_shape: [480, 640, 3]
  warmup_depth_shape: [480, 640, 1]
  warmup_intrinsic:
    - [388.0, 0.0, 320.0]
    - [0.0, 388.0, 240.0]
    - [0.0, 0.0, 1.0]
  log_obs_details: true
  profile_enabled: false
  profile_steps: 5
  profile_skip_first: 0
  profile_dir: outputs/serving_profile
  record_enabled: true
  record_root_dir: outputs/serving_records

env_wrapper:
  enabled: true
  image_key: image
  depth_key: depth_image
  intrinsic_key: camera_intrinsics
  instruction_key: instruction
  states_key: states
