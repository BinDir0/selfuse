# @package _global_
#
# WebDataset shard paths for VLM training.
#

vlm_wds_base_dir: /share_data/guantianrui/datasets/VLM/FineVision_Webdataset

vlm_wds_datasets:
  - name: FineVision
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/FineVision/train/shard-*.tar
    weight: 10
  - name: Robo2VLM
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/Robo2VLM/train/shard-*.tar
    weight: 1
  - name: RoboPoint
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/RoboPoint/train/shard-*.tar
    weight: 2
  - name: Roborefit
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/Roborefit/train/shard-*.tar
    weight: 0.1
  - name: RoboAfford
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/RoboAfford/train/shard-*.tar
    weight: 1
  - name: ShareRobot
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/ShareRobot/train/shard-*.tar
    weight: 0.5

val_vlm_wds_datasets:
  - name: FineVision
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/FineVision/test/shard-*.tar
  - name: Robo2VLM
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/Robo2VLM/test/shard-*.tar
  - name: RoboPoint
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/RoboPoint/test/shard-*.tar
  - name: Roborefit
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/Roborefit/test/shard-*.tar
  - name: RoboAfford
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/RoboAfford/test/shard-*.tar
  - name: ShareRobot
    shard_urls: /share_data/guantianrui/datasets/VLM/Webdataset/ShareRobot/test/shard-*.tar
