# @package _global_
defaults: 
  - override /hydra/launcher: submitit_local
  - _self_

name: vq_tokenizer
exp_name: "vq_tokenizer"
_target_: src.workspace.train_vq_tokenizer.TrainVQTokenizerWorkspace

image_shape: [224, 224, 3]
dataset_paths:
 - /share_data/datasets/taco/taco_45pca_newpresence.zarr
 - /share_data/datasets/OakInk-v2/oakink2.zarr
#  - /share_data/datasets/hoi4d_segmented/hoi4d_train.zarr
#  - /share_data/datasets/EgoDex/egodex_train.zarr

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
    state:
      wrist:
        shape: [18]
      hand: 
        shape: [30]
      shape: [48]
      type: low_dim
      horizon: ${n_obs_state_steps}
  action:
    shape: [48]
    horizon: ${n_action_steps}

dataset:
  _target_: src.dataset.legendvla_dataset.LegendVLALowLevelDataset
  zarr_paths: ${dataset_paths}
  horizon: ${eval:'${n_action_steps}+${history}'}
  pad_before: ${eval:'${history}+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  shape_meta: ${shape_meta}
  history: ${history} # frames
  seed: 42
  val_ratio: 0.005
  return_numpy: False # whether to return numpy arrays
  normalizer_dataloader_cfg:
    batch_size: 4096
    num_workers: 192
    shuffle: True
    pin_memory: True
    persistent_workers: True

history: 30
n_action_steps: 30
n_obs_image_steps: 2
n_obs_state_steps: 30
n_latency_steps: 0
# Make sure history is divisible by (n_obs_image_steps - 1) and (n_obs_state_steps - 1)

dataloader:
  batch_size: 2048
  num_workers: 24
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 2048
  num_workers: 24
  shuffle: False
  pin_memory: True
  persistent_workers: True

# Define base configs with anchors
base_model_config: &base_model_config
  down_t: 2
  stride_t: 2
  width: 256
  depth: 3
  dilation_growth_rate: 3
  output_emb_width: 256
  activate: relu
  norm: null
  num_conv_layers: 3

base_quantizer_config: &base_quantizer_config
  quantizer_name: group_residualvq
  nb_code: 1024
  codebook_dim: 256
  num_quantizers: 8
  num_groups: 1
  shared_codebook: True

base_loss_config: &base_loss_config
  recons_loss: l2
  commit_weight: 0.02

# Define base tokenizer arguments
base_tokenizer_args: &base_tokenizer_args
  use_part: wrist
  motion_dim: ${eval:'${shape_meta.obs.state.shape[0]}//2'}
  wrist_dim: ${eval:'${shape_meta.obs.state.wrist.shape[0]}//2'} # per wrist
  hand_dim: ${eval:'${shape_meta.obs.state.hand.shape[0]}//2'} # per hand
  model_config:
    <<: *base_model_config
  quantizer_config:
    <<: *base_quantizer_config
  loss_config:
    <<: *base_loss_config

# Define base optimizer arguments
base_optimizer: &base_optimizer
  lr: 2e-4
  betas: [0.9, 0.999]
  weight_decay: 1e-4

tokenizer: 
  states: 
    wrist: 
      _target_: src.model.action.vq_model.MotionVQModel
      config:
        _target_: src.model.action.vq_config.MotionVQModelConfig
        <<: *base_tokenizer_args
        use_part: wrist
        quantizer_config:
          <<: *base_quantizer_config
          nb_code: 2048    # partially override the base quantizer config
          codebook_dim: 256
    hand: 
      _target_: src.model.action.vq_model.MotionVQModel
      config:
        _target_: src.model.action.vq_config.MotionVQModelConfig
        <<: *base_tokenizer_args
        use_part: hand
    use_part: True
  actions: 
    wrist: 
      _target_: src.model.action.vq_model.MotionVQModel
      config:
        _target_: src.model.action.vq_config.MotionVQModelConfig
        <<: *base_tokenizer_args
        use_part: wrist
        quantizer_config:
          <<: *base_quantizer_config
          nb_code: 2048    # partially override the base quantizer config
          codebook_dim: 256
    hand: 
      _target_: src.model.action.vq_model.MotionVQModel
      config:
        _target_: src.model.action.vq_config.MotionVQModelConfig
        <<: *base_tokenizer_args
        use_part: hand
    use_part: True

optimizer:
  states: 
    wrist: 
      <<: *base_optimizer
    hand: 
      <<: *base_optimizer
  actions: 
    wrist: 
      <<: *base_optimizer
    hand: 
      <<: *base_optimizer


training:
  device: cuda
  num_epochs: 10
  tqdm_interval_sec: 1.0
  max_train_steps: 
  max_val_steps: 100
  val_per_epoch: 1
  ckpt_save_interval: 1
  normalizer_path: /home/chenzhang/project/EgoVLA/outputs/2025.10.16/19.47_vq_tokenizer_train_vq_tokenizer/normalizer.pkl
  valid_tokenizer_path: # /share_data/tokenizers/GRVQ/taco-oakink/state20-2048action10-1024
  # if valid_tokenizer_path is not None, will validate the tokenizer
  save_path: 

logging:
  project: train_vq_tokenizer
  entity: LegendaryVLA
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}
  tags: ["${name}", "${hydra:runtime.choices.experiment}", "${exp_name}"]
  id: null
  group: null

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  launcher:
    gpus_per_node: 8  # total number of GPUs on the machine
    tasks_per_node: 8 # number of tasks to run simultaneously (usually equal to gpus_per_node)
    cpus_per_task: 32 # number of CPU cores per task
    mem_gb: 256        # number of GB memory per task
    timeout_min: 4320 # task timeout time (e.g. 3 days)
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_train_vq_tokenizer_multirun
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_train_vq_tokenizer_multirun
    subdir: ${hydra.job.num}

