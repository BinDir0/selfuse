# @package _global_
name: vq_tokenizer
exp_name: "vq_tokenizer"
_target_: src.workspace.train_grvq_tokenizer.TrainVQTokenizerWorkspace

image_shape: [224, 224, 3]
dataset_paths:
 - /share_data/datasets/taco/taco_45pca_newpresence.zarr
 - /share_data/datasets/OakInk-v2/oakink2.zarr
 - /share_data/datasets/hoi4d_segmented/hoi4d_train.zarr
 - /share_data/datasets/EgoDex/egodex_train.zarr

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
    state:
      wrist:
        shape: [18]
      hand: 
        shape: [30]
      shape: [48]
      type: low_dim
      horizon: ${n_obs_state_steps}
  action:
    shape: [48]
    horizon: ${n_action_steps}

dataset:
  _target_: src.dataset.legendvla_dataset.LegendVLALowLevelDataset
  zarr_paths: ${dataset_paths}
  horizon: ${eval:'${n_action_steps}+${history}'}
  pad_before: ${eval:'${history}+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  shape_meta: ${shape_meta}
  history: ${history} # frames
  normalizer_dataloader_cfg:
    batch_size: 4096
    num_workers: 192
    shuffle: True
    pin_memory: True
    persistent_workers: True

history: 30
n_action_steps: 30
n_obs_image_steps: 2
n_obs_state_steps: 6
n_latency_steps: 0
# Make sure history is divisible by (n_obs_image_steps - 1) and (n_obs_state_steps - 1)

dataloader:
  batch_size: 4096
  num_workers: 24
  shuffle: True
  pin_memory: True
  persistent_workers: True

# Define base tokenizer arguments
base_tokenizer_args: &base_tokenizer_args
  codebook_dim: 256
  nb_code: 1024
  mu: 0.99
  model:
    down_t: 2
    stride_t: 2
    width: 256
    depth: 3
    dilation_growth_rate: 3
    output_emb_width: 256
    activate: relu
    norm: null
    num_conv_layers: 3
  quantizer:
    quantizer_name: group_residualvq
    quantbeta: 1
    num_quantizers: 8
    num_groups: 1
    shared_codebook: True
  loss:
    recons_loss: l2
    commit_weight: 0.02

# Define base optimizer arguments
base_optimizer: &base_optimizer
  lr: 2e-4
  betas: [0.9, 0.999]
  weight_decay: 1e-4

tokenizer: 
  states: 
    use_part: True
    wrist: 
      __target__: src.model.action.vq_tokenizer.PartialMotionVQModel
      shape_meta: ${shape_meta}
      args:
        <<: *base_tokenizer_args
        use_part: wrist
    hand: 
      __target__: src.model.action.vq_tokenizer.PartialMotionVQModel
      shape_meta: ${shape_meta}
      args:
        <<: *base_tokenizer_args
        use_part: hand
  actions: 
    use_part: True
    wrist: 
      __target__: src.model.action.vq_tokenizer.PartialMotionVQModel
      shape_meta: ${shape_meta}
      args:
        <<: *base_tokenizer_args
        use_part: wrist
    hand: 
      __target__: src.model.action.vq_tokenizer.PartialMotionVQModel
      shape_meta: ${shape_meta}
      args:
        <<: *base_tokenizer_args
        use_part: hand

optimizer:
  states: 
    wrist: 
      <<: *base_optimizer
    hand: 
      <<: *base_optimizer
  actions: 
    wrist: 
      <<: *base_optimizer
    hand: 
      <<: *base_optimizer


training:
  tqdm_interval_sec: 1.0
  max_corpus_size: 2000
  max_val_steps: 100
  normalizer_path: # /share_data/normalizer/egodex-hoi4d-oakink-taco/normalizer.pkl
  valid_tokenizer_path: # /share_data/tokenizers/GRVQ/taco-oakink/state20-2048action10-1024
  save_path: 

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
