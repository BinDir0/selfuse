# @package _global_
defaults:
  - vla_wds_dataset_paths
  - vlm_wds_dataset_paths
  - _self_

name: legendvla_qwen3_vl
exp_name: legendvla_qwen3_vl
_target_: src.workspace.train_unified_vla_workspace.TrainUnifiedVLAWorkspace

objective:
lora: False
quantize: False

vision_resolution: 224
image_shape:
  - ${vision_resolution}
  - ${vision_resolution}
  - 3
depth_image_shape:
  - ${vision_resolution}
  - ${vision_resolution}

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
      stride: ${n_obs_image_stride}
    depth:
      shape: ${depth_image_shape}
      type: depth
      horizon: 0
      stride: 1
    state:
      wrist:
        shape: [18]
      hand:
        shape: [30]
      shape: [48]
      type: fingertips
      horizon: ${n_obs_state_steps}
      stride: ${n_obs_state_stride}
  action:
    shape: [48]
    type: fingertips
    horizon: ${n_action_steps}
    stride: ${n_action_stride}

n_obs_image_steps: 1
n_obs_image_stride: 1
n_obs_state_steps: 18
n_obs_state_stride: 10
n_action_steps: 32
n_action_stride: 1

ignore_index: -100
depth_clip_range: [0.0, 5.0]
max_vlm_tokens: 768
tokenizer_padding: max_length
single_image_only: True

dataset:
  _target_: src.dataset.vla_dataset.UnifiedWdsDataset
  vla_dataset:
    _target_: src.dataset.vla_dataset.VLAWdsDataset
    wds_datasets: ${vla_wds_datasets}
    shape_meta: ${shape_meta}
    objective: ${objective}
    use_relative_action: True
    depth_clip_range: ${depth_clip_range}
    val_wds_datasets: ${val_vla_wds_datasets}
    history_pad_mode: repeat
    future_pad_mode: truncate
    shuffle_buffer: 4096
  vlm_dataset:
    _target_: src.dataset.vlm_dataset.VLMWdsDataset
    wds_datasets: ${vlm_wds_datasets}
    seed: 42
    shuffle_buffer: 4096
    weights: [0.5, 0.5, 0.5]
    val_wds_datasets: ${val_vlm_wds_datasets}
  vla_ratio: ${eval:'5/6'}
  batch_size: ${dataloader.loader.batch_size}

vla_processor:
  _target_: src.dataset.qwen3_vl_processing.Qwen3VLVLAProcessor
  model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
  max_seq_len: ${max_vlm_tokens}
  ignore_index: ${ignore_index}
  tokenizer_padding: ${tokenizer_padding}
  trust_remote_code: False
  single_image_only: ${single_image_only}

vlm_processor:
  _target_: src.dataset.qwen3_vl_processing.Qwen3VLProcessor
  model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
  max_seq_len: ${max_vlm_tokens}
  ignore_index: ${ignore_index}
  tokenizer_padding: ${tokenizer_padding}
  trust_remote_code: False
  single_image_only: ${single_image_only}

dataloader:
  loader:
    batch_size: 8
    num_workers: 4
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 16

val_dataloader:
  loader:
    batch_size: 8
    shuffle: False
    drop_last: False
    num_workers: 2
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 8

flow:
  sig_min: 0.001
  sampling: beta
  alpha: 1.5
  beta: 1.0
  num_inference_steps: 10

optimizer:
  action:
    lr: 3e-4
    betas: [0.9, 0.95]
    weight_decay: 2e-2
  vlm:
    lr: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 5e-3
  diffloss:
    lr: 5e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2

training:
  steps_per_epoch: 100000
  seed: 42
  dynamic_data_seed: True
  objective: ${objective}
  debug: False
  profile: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  train_vlm: True
  train_depth: False
  init_motion_token_embeddings: False
  load_pretrained_vlm_weights: False
  load_pretrained_pi05_weights: False
  resume_checkpoint_path:
  finetune_checkpoint_path:
  normalizer_path: /share_data/zengfanlian/Projects/EgoVLA/outputs/normalizer/2026.03.16-relative-mixed/normalizer.pkl
  max_train_steps: null
  max_eval_steps: null
  num_epochs: 2
  use_bf16: True
  log_interval: 20
  eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
  save_eval_attn_weights: False
  eval_every: 99999999
  checkpoint_every: 99999999
  ckpt_save_interval: 99999999
  clipping:
    enabled: True
    max_grad_norm: 1.0
  average:
    ema:
      enabled: False
      decay: 0.99
      start: 2000
      freq: 1
      device:
    swa:
      enabled: False
      start: 100000
      freq: 100000
      device:
  compile:
    enabled: False
    fullgraph: True
    backend: inductor
    mode: default
    dynamic:

policy:
  _target_: src.policy.legendvla.LegendVLA
  cfg:
    ignore_index: ${ignore_index}
    final_logit_softcapping:
    flow_sig_min: ${flow.sig_min}
    num_inference_steps: ${flow.num_inference_steps}
    time_hidden_size: 1024
    time_min_period: 0.004
    time_max_period: 4.0
    ar_action_noise_std: 0.02
    ar_action_chunk_size: 4
    diffloss_micro_batch_size: 16
    use_rtc: True
    rtc_delay_strategy: exp
    rtc_max_delay: 16
    backbone:
      model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
      trust_remote_code: False
      freeze_backbone: False
      torch_dtype: bfloat16
      state_token: <state>
      action_token: <action>
    expert:
      hidden_size: 1024
      intermediate_size: 4096
      num_layers: 8
      rope_theta: 10000.0
      attention_bias: False
    diffloss:
      enabled: True
      target_channels: ${eval:'48*4'}
      z_channels: 2048
      depth: 8
      width: 2048
      num_sampling_steps: "100"
      grad_checkpointing: False
      use_ddim_sampling: True
      use_flow_matching: False
      flow_sig_min: ${flow.sig_min}
      time_min_period: 0.004
      time_max_period: 4.0
      flow_sampling: ${flow.sampling}
      flow_alpha: ${flow.alpha}
      flow_beta: ${flow.beta}
      num_inference_steps: ${flow.num_inference_steps}
    loss_weights:
      ce_loss_weight: 0.1
      diffusion_loss_weight: 20.0
      flow_loss_weight: 1.0
  shape_meta: ${shape_meta}

logging:
  project: unified-vla
  entity: LegendaryVLA
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}
  tags: ["${name}", "${hydra:runtime.choices.experiment}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: update_step
    mode: max
    k: 1
    format_str: update_step={update_step:04d}
  save_last_ckpt: False
  save_last_snapshot: False

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
