# @package _global_
defaults:
  - vla_wds_dataset_paths
  - vlm_wds_dataset_paths
  - _self_

name: legendvla_qwen3_vl
exp_name: legendvla_qwen3_vl
_target_: src.workspace.train_legendvla_deepspeed_workspace.TrainLegendVLAWorkspace

objective:
lora: False
quantize: False
# Attention backend used by the Qwen3-VL text tower and the Qwen3 action expert.
# Valid values in transformers 5.3.0: eager, sdpa, flash_attention_2, flash_attention_3.
# Use `sdpa` as the safe default. Switch to `flash_attention_x` after installing `flash-attn`.
# `flash_attention_3` is mainly intended for Hopper-class GPUs and may require a separate setup.
attn_implementation: sdpa

vision_resolution: 224
image_shape:
  - ${vision_resolution}
  - ${vision_resolution}
  - 3
depth_image_shape:
  - ${vision_resolution}
  - ${vision_resolution}

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
      stride: ${n_obs_image_stride}
    depth:
      shape: ${depth_image_shape}
      type: depth
      horizon: 0
      stride: 1
    state:
      wrist:
        shape: [18]
      hand:
        shape: [30]
      shape: [48]
      type: fingertips
      horizon: ${n_obs_state_steps}
      stride: ${n_obs_state_stride}
  action:
    shape: [48]
    type: fingertips
    horizon: ${n_action_steps}
    stride: ${n_action_stride}

n_obs_image_steps: 1
n_obs_image_stride: 1
n_obs_state_steps: 18
n_obs_state_stride: 10
n_action_steps: 32
n_action_stride: 1

vlm_hidden_size: 2560

# Module dimensions
action_hidden_size: 1024
time_hidden_size: 1024
diffloss_z_channels: 2048
action_dim: 48
state_dim: 48
ignore_index: -100
depth_clip_range: [0.0, 5.0]
max_vlm_tokens: 768
tokenizer_padding: max_length
video_base_fps: 30.0
dataset:
  _target_: src.dataset.vla_dataset.UnifiedWdsDataset
  vla_dataset:
    _target_: src.dataset.vla_dataset.VLAWdsDataset
    wds_datasets: ${vla_wds_datasets}
    shape_meta: ${shape_meta}
    objective: ${objective}
    use_relative_action: True
    depth_clip_range: ${depth_clip_range}
    val_wds_datasets: ${val_vla_wds_datasets}
    history_pad_mode: repeat
    future_pad_mode: truncate
    shuffle_buffer: 4096
    video_base_fps: ${video_base_fps}
  vlm_dataset:
    _target_: src.dataset.vlm_dataset.VLMWdsDataset
    wds_datasets: ${vlm_wds_datasets}
    seed: 42
    shuffle_buffer: 4096
    weights: [0.5, 0.5, 0.5]
    val_wds_datasets: ${val_vlm_wds_datasets}
  vla_ratio: ${eval:'5/6'}
  batch_size: ${dataloader.loader.batch_size}

data_collator:
  _target_: src.dataset.unified_vla_collator.UnifiedVLACollator
  formatter:
    _target_: src.dataset.qwen3_vl_batching.Qwen3VLChatFormatter
    state_token: <state>
    action_token: <action>
    lowercase_vla_text: True
  batch_processor:
    _target_: src.dataset.qwen3_vl_batching.Qwen3VLBatchProcessor
    model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
    processor_init_kwargs:
      trust_remote_code: False
      size:
        shortest_edge: 65536
        longest_edge: 307200
    processor_call_kwargs:
      padding: ${tokenizer_padding}
      max_length: ${max_vlm_tokens}
      return_tensors: pt
    ignore_index: ${ignore_index}
    padding_side: right
    state_token: <state>
    action_token: <action>
dataloader:
  loader:
    batch_size: 8
    num_workers: 4
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 16

val_dataloader:
  loader:
    batch_size: 8
    shuffle: False
    drop_last: False
    num_workers: 2
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 8

flow:
  sig_min: 0.001
  sampling: beta
  alpha: 1.5
  beta: 1.0
  num_inference_steps: 10

optimizer:
  action:
    lr: 3e-4
    betas: [0.9, 0.95]
    weight_decay: 2e-2
  vlm:
    lr: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 5e-3
  diffloss:
    lr: 5e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2

training:
  steps_per_epoch: 100000
  seed: 42
  dynamic_data_seed: True
  objective: ${objective}
  debug: False
  profile: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  train_vlm: True
  train_depth: False
  init_motion_token_embeddings: False
  resume_checkpoint_path:
  finetune_checkpoint_path:
  normalizer_path: /share_data/zengfanlian/Projects/EgoVLA/outputs/normalizer/2026.03.16-relative-mixed/normalizer.pkl
  max_train_steps: null
  max_eval_steps: null
  num_epochs: 2
  use_bf16: True
  log_interval: 20
  eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5]
  save_eval_attn_weights: False
  eval_every: 5000
  checkpoint_every: 5000
  ckpt_save_interval: 10000
  clipping:
    enabled: True
    max_grad_norm: 1.0
  average:
    ema:
      enabled: False
      decay: 0.99
      start: 2000
      freq: 1
      device:
    swa:
      enabled: False
      start: 100000
      freq: 100000
      device:
  compile:
    enabled: False  # Set True to wrap the full training model with torch.compile.
    fullgraph: False  # Start with False for dynamic multimodal training workloads.
    backend: inductor  # Default PyTorch compiler backend for CUDA workloads.
    mode: default  # Good starting point. Try reduce-overhead mainly for stable inference-like shapes.
    dynamic:  # Leave null for the PyTorch default. Set True only when variable shapes cause recompiles.

policy:
  _target_: src.policy.legendvla.LegendVLA
  backbone:
    _target_: src.model.vlm.qwen3_vl_backbone.Qwen3VLBackboneWrapper
    model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
    trust_remote_code: False
    freeze_backbone: False
    torch_dtype: bfloat16
    state_token: <state>
    action_token: <action>
    use_lora: ${lora}
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      bias: none
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    use_quantization: ${quantize}
    attn_implementation: ${attn_implementation}
    quantization:
      load_in_4bit: True
      load_in_8bit: False
      bnb_4bit_quant_type: nf4
      bnb_4bit_use_double_quant: True
      bnb_4bit_compute_dtype: bfloat16
  state_encoder:
    _target_: src.model.action.action_head.FourierActionEncoder
    action_dim: ${state_dim}
    width: ${vlm_hidden_size}
    time_cond: False
    enable_fourier_embed: False
    mlp_depth: 2
    final_layer_norm: False
    use_mlp_layer_norm: False
  ar_action_encoder:
    _target_: src.model.action.action_head.FourierActionEncoder
    action_dim: ${action_dim}
    width: ${vlm_hidden_size}
    time_cond: False
    enable_fourier_embed: False
    mlp_depth: 2
    final_layer_norm: False
    use_mlp_layer_norm: False
  action_encoder:
    _target_: src.model.action.action_head.FourierActionEncoder
    action_dim: ${action_dim}
    width: ${action_hidden_size}
    time_cond: False
    enable_fourier_embed: False
    mlp_depth: 2
    final_layer_norm: False
    use_mlp_layer_norm: False
  time_embedding:
    _target_: src.model.common.modules.TimeEmbedding
    time_hidden_size: ${time_hidden_size}
    min_period: 0.004
    max_period: 4.0
  flow_expert:
    _target_: src.model.action_expert.qwen3_action_expert.Qwen3ActionExpert
    model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
    time_hidden_size: ${time_hidden_size}
    hidden_size: ${action_hidden_size}
    intermediate_size: 4096
    num_heads: 32
    attn_implementation: ${attn_implementation}
  action_decoder:
    _target_: src.model.action.action_head.MLPProjector
    input_dim: ${action_hidden_size}
    output_dim: ${action_dim}
    width: ${action_hidden_size}
    depth: 2
    final_layer_norm: False
    use_mlp_layer_norm: False
  latent_condition_projector:
    _target_: src.model.action.action_head.MLPProjector
    input_dim: ${vlm_hidden_size}
    output_dim: ${diffloss_z_channels}
    width: ${vlm_hidden_size}
    depth: 2
    final_layer_norm: False
    use_mlp_layer_norm: False
  diffloss:
    _target_: src.model.action.diffloss.DiffLoss
    target_channels: ${eval:'${action_dim}*4'}
    z_channels: ${diffloss_z_channels}
    depth: 8
    width: 2048
    num_sampling_steps: "100"
    grad_checkpointing: False
    use_ddim_sampling: True
    use_flow_matching: False
    flow_sig_min: ${flow.sig_min}
    time_min_period: 0.004
    time_max_period: 4.0
    flow_sampling: ${flow.sampling}
    flow_alpha: ${flow.alpha}
    flow_beta: ${flow.beta}
    num_inference_steps: ${flow.num_inference_steps}
  shape_meta: ${shape_meta}
  ignore_index: ${ignore_index}
  action_hidden_size: ${action_hidden_size}
  flow_sig_min: ${flow.sig_min}
  num_inference_steps: ${flow.num_inference_steps}
  ar_action_noise_std: 0.02
  ar_action_chunk_size: 4
  diffloss_micro_batch_size: 16
  use_rtc: True
  rtc_delay_strategy: exp
  rtc_max_delay: 8
  knowledge_insulation: True
  ce_loss_weight: 0.1
  diffusion_loss_weight: 20.0
  flow_loss_weight: 1.0

logging:
  project: unified-vla
  entity: LegendaryVLA
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}
  tags: ["${name}", "${hydra:runtime.choices.experiment}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: update_step
    mode: max
    k: 1
    format_str: update_step={update_step:04d}
  save_last_ckpt: False
  save_last_snapshot: False

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
