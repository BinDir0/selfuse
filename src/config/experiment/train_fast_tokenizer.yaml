# @package _global_
name: fast_tokenizer
exp_name: "fast_tokenizer"
_target_: src.workspace.train_fast_tokenizer.TrainFastTokenizerWorkspace

image_shape: [224, 224, 3]
dataset_paths:
#  - /share_data/datasets/taco/taco_45pca_newpresence.zarr
#  - /share_data/datasets/OakInk-v2/oakink2.zarr
#  - /share_data/datasets/hoi4d_segmented/hoi4d_train.zarr
#  - /share_data/datasets/EgoDex/egodex_train.zarr
 - /share_data/yeyuyao/egodex_filter_train.zarr

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
    state:
      wrist:
        shape: [18]
      hand: 
        shape: [30]
      shape: [48]
      type: fingertips # fingertips or mano
      horizon: ${n_obs_state_steps}
  action:
    shape: [48]
    type: fingertips # fingertips or mano
    horizon: ${n_action_steps}

dataset:
  _target_: src.dataset.legendvla_dataset.LegendVLALowLevelDataset
  zarr_paths: ${dataset_paths}
  horizon: ${eval:'${n_action_steps}+${history}'}
  pad_before: ${eval:'${history}+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  shape_meta: ${shape_meta}
  history: ${history} # frames
  normalizer_dataloader_cfg:
    batch_size: 4096
    num_workers: 192
    shuffle: True
    pin_memory: True
    persistent_workers: True

history: 30
n_action_steps: 30
n_obs_image_steps: 2
n_obs_state_steps: 30
n_latency_steps: 0
# Make sure history is divisible by (n_obs_image_steps - 1) and (n_obs_state_steps - 1)

dataloader:
  batch_size: 4096
  num_workers: 192
  shuffle: True
  pin_memory: True
  persistent_workers: True

tokenizer: 
  states: 
    scale: 20
    vocab_size: 2048
    num_workers: 192
  actions: 
    scale: 10
    vocab_size: 1024
    num_workers: 192

training:
  tqdm_interval_sec: 1.0
  max_corpus_size: 2000
  max_val_steps: 100
  normalizer_path: /share_data/normalizer/egodex-hoi4d-oakink-taco/normalizer.pkl
  valid_tokenizer_path: # /share_data/tokenizers/FAST/taco-oakink/state20-2048action10-1024
  save_path: # /home/chenzhang/project/EgoVLA/outputs/2025.09.19/17.56_fast_tokenizer_train_fast_tokenizer/tokenizer

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
