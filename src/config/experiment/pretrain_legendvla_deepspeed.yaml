#    weight: 8
vlm_dataset_paths:
 - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/objects365_qa_filtered"  # localization & grounding
 - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/spatialsense_filtered"  # spatialsense
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/alfworldgpt_filtered"  # high level subtask action
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/indoor_qa_filtered" 
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/LLaVA_Instruct_150K_filtered" 
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/cocoqa_filtered" 
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/cambrian(filtered)_processed_filtered"
