#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/wildvision"
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/yesbut"

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
      stride: ${n_obs_image_stride}
    depth:
      shape: ${depth_image_shape}
      type: depth
      horizon: ${n_obs_image_steps}
      stride: ${n_obs_image_stride}
    state:
      wrist:
        shape: [18]
      hand: 
        shape: [30]
      shape: [48]
      type: fingertips # fingertips or mano
      horizon: ${n_obs_state_steps}
      stride: ${n_obs_state_stride}
  action:
    shape: [48]
    type: fingertips # fingertips or mano
    horizon: ${n_action_steps}
    stride: ${n_action_stride}

dataset:
  _target_: src.dataset.legendvla_dataset.LegendUnifiedDataset
  vla_dataset: 
    _target_: src.dataset.legendvla_dataset.LegendVLADataset
    zarr_paths: ${vla_dataset_paths}
    shape_meta: ${shape_meta}
    seed: 42
    val_ratio: 0.001
    objective: ${objective}
    normalizer_dataloader_cfg:
      batch_size: 4096
      num_workers: 120
      shuffle: False
      pin_memory: True
      persistent_workers: True
    use_relative_action: False
    depth_clip_range: ${depth_clip_range}
  vlm_dataset:
    _target_: src.dataset.legendvla_dataset.LegendVLMDataset
    dataset_paths: ${vlm_dataset_paths}
    split: train
    cache_dir: /share_data/guantianrui/datasets/VLM/FineVision/.cache
    seed: 42
    weights: [0.5, 0.5, 0.5]
    
n_obs_image_steps: 1
n_obs_image_stride: 30
n_obs_state_steps: 16
n_obs_state_stride: 2
n_action_steps: 32
n_action_stride: 1

vla_processor: 
  _target_: src.dataset.paligemma_processing.PaliGemmaVLAProcessor
  tokenizer: 
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${training.pretrained_model_path}
    padding_side: right
  num_image_tokens: ${policy.vision_tower.config.num_image_tokens}
  max_seq_len: ${max_vlm_tokens}
  ignore_index: ${ignore_index}
  image_size: ${policy.vision_tower.config.image_size}
  depth_image_size: ${policy.depth_encoder.config.image_size}
  tokenizer_padding: ${tokenizer_padding} 

vlm_processor: 
  _target_: src.dataset.paligemma_processing.PaliGemmaProcessor
  tokenizer: 
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${training.pretrained_model_path}
    padding_side: right
  num_image_tokens: ${policy.vision_tower.config.num_image_tokens}
  max_seq_len: ${max_vlm_tokens}
  ignore_index: ${ignore_index}
  image_size: ${policy.vision_tower.config.image_size}
  tokenizer_padding: ${tokenizer_padding} 

dataloader:
  batch_sampler: 
    # Note: For vision_resolution=448, consider reducing batch_size (e.g., 8 or 4) due to 4x memory usage
    batch_size: 16
    vla_ratio: ${eval:'5/6'} # ratio of VLA samples in each batch
    seed: 42
    shuffle: True
    drop_last: False
  loader: 
    num_workers: 16
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 32

val_dataloader:
  batch_sampler: 
    # Note: For vision_resolution=448, consider reducing batch_size (e.g., 8 or 4) due to 4x memory usage
    batch_size: 16
    shuffle: False
    drop_last: False
  loader: 
    num_workers: 16
    pin_memory: True
    persistent_workers: True
    prefetch_factor: 32

flow: 
  sig_min: 0.001
  sampling: beta
  alpha: 1.5
  beta: 1
  num_inference_steps: 10

optimizer:
  action: 
    lr: 5e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2
  vlm:
    lr: 1e-4 # We can try smaller learning rate than action for VLM
    betas: [0.9, 0.95]
    weight_decay: 1e-5
  diffloss:
    lr: 8e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2

training:
  seed: 42
  objective: ${objective}
  debug: False
  profile: False
  resume: True
  lr_scheduler: cosine # follow the naming convention of Transformers
  lr_warmup_steps: 2000 # number of global steps to warm up
  train_vlm: True
  init_motion_token_embeddings: True # initialize motion token embeddings
  load_pretrained_vlm_weights: True # load pretrained weights from VLM
  load_pretrained_pi05_weights: False # load pretrained weights from PI05 (disabled for 448 resolution)
  # Automatically select pretrained model path based on vlm_backbone and vision_resolution
  pretrained_model_path: /share_data/chenzhang/checkpoints/${vlm_backbone}-3b-pt-${vision_resolution}
  pretrained_pi05_model_path: /share_data/chenzhang/checkpoints/pi05_base_pytorch # use pi05 checkpoint first
  dinov2_repo_path: /share_data/chenzhang/repos/dinov2
  dinov2_model_path: /share_data/chenzhang/checkpoints/dinov2/dinov2_vitb14_reg4_pretrain.pth
  resume_checkpoint_path: # /home/chenzhang/projects/diffloss-ar/outputs/2026.02.06/00.23_legendvla_pretrain_legendvla_deepspeed/checkpoints/update_step=25000-eval_l1_loss=0.3644
  normalizer_path: /home/chenzhang/projects/diffloss-ar/outputs/normalizer/2026.02.07/normalizer.pkl
  num_epochs: 2
  use_bf16: True
  clipping:
    enabled: True
    max_grad_norm: 1.0
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  average:
    ema: 
      enabled: False
      decay: 0.99
      start: 2000 # start from 1st step
      freq: 1
      device: # not supported for specific device
    swa:
      enabled: False
      start: 100000
      freq: 100000
      device: # not supported for specific device
  # training loop control
  # in epochs
  ckpt_save_interval: 10000
  eval_every: 5000
  # make sure it is divisible by eval_every
  # cause we use eval_l1 loss to save topk checkpoint
  checkpoint_every: 5000 
  # steps per epoch
  max_train_steps: null
  max_eval_steps: null
  # evaluation settings
  eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5] # Action accuracy thresholds for evaluation
  # misc
  log_interval: 20

mixture:
  # Note: Make sure the order of the mixtures is correct, i.e., vlm should be the first one, then action
  vlm:   # gemma or gemma2
    # Conditional dimensions based on vlm_backbone
    hidden_size: ${eval:'2304 if "${vlm_backbone}"=="paligemma2" else 2048'}
    intermediate_size: ${eval:'9216 if "${vlm_backbone}"=="paligemma2" else 16384'}
    use_final_norm: True
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:  # not applicable for gemma
    rope_theta: 10000.0  # 10000 in gemma
    # Gemma2-specific: Query pre-attention scalar for numerical stability
    query_pre_attn_scalar: ${eval:'256 if "${vlm_backbone}"=="paligemma2" else None'}
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
    rope_theta: ${action_expert_rope_theta}

time_hidden_size: 1024 # only applicable if using adaptive
time_min_period: 0.004
time_max_period: 4.0
action_expert_rope_theta: 10000.0   # since action/proprio seq_len is pretty small
# pi0.5 uses 10000 for action expert

# Fixed
depth_clip_range: [0.0, 5.0]
imagenet_mean: [0.485, 0.456, 0.406]
imagenet_std: [0.229, 0.224, 0.225]
ignore_index: -100
image_token_index: 257152
state_token_index: 257153
action_token_index: 257154
vocab_size: 257216
pad_token_id: 0
patch_size: 14
image_seq_len: ${eval:'(${image_shape[0]}//${patch_size})*(${image_shape[1]}//${patch_size})'}
depth_image_seq_len: ${eval:'(${depth_image_shape[0]}//${patch_size})*(${depth_image_shape[1]}//${patch_size})'}
state_seq_len: 256 # 
text_seq_len: ${eval:'${state_seq_len}+128'}
answer_seq_len: 256 
# Make sure at least one tokens for VLM answer in the training, 
# otherwise it will cause error(the VLM parameters may have no gradient, then it will cause error in all-reduce stage)
max_vlm_tokens: ${eval:'${image_seq_len}*${shape_meta.obs.rgb.horizon}+${text_seq_len}+${answer_seq_len}'}
tokenizer_padding: max_length # longest or max_length

policy: 
  _target_: src.policy.legendvla.LegendVLA
  cfg: 
    vocab_size: ${vocab_size}
    pad_token_id: ${pad_token_id}
    ignore_index: ${ignore_index}
    image_token_index: ${image_token_index}
    state_token_index: ${state_token_index}
    action_token_index: ${action_token_index}
    use_lm_head: True
    # Gemma2-specific: Final logit softcapping for numerical stability in text generation
    final_logit_softcapping: ${eval:'30.0 if "${vlm_backbone}"=="paligemma2" else None'}
    max_vlm_tokens: ${max_vlm_tokens}
    use_action_position_ids_continue_from_vlm: False
    num_inference_steps: ${flow.num_inference_steps}
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    time_min_period: ${time_min_period}
    time_max_period: ${time_max_period}
    flow_sig_min: ${flow.sig_min}
    # Add pretrained_model_path for loading pre-trained VLM weights
    pretrained_model_path: ${training.pretrained_model_path}
    pretrained_pi05_model_path: ${training.pretrained_pi05_model_path}
    # Depth image support
    use_depth: True  # Enable depth image processing with DINOv2
    depth_dropout: 0.1
    diffloss_micro_batch_size: 4
    loss_weights: 
      ce_loss_weight: 0.1
      diffusion_loss_weight: 1.0
      flow_loss_weight: 1.0
  shape_meta: ${shape_meta}
  action_encoder_ar: 
    _target_: src.model.action.action_head.FourierActionEncoder
    action_dim: 48
    width: ${mixture.vlm.hidden_size}  # Match VLM hidden size
    time_cond: False
    enable_fourier_embed: False
    mlp_depth: 2 # 0 means no MLP
    fourier_embed_dim: 1024
    fourier_scale: 1.0
  latent_condition_projector:
    _target_: src.model.action.action_head.MLPProjector
    input_dim: 2048
    output_dim: 2048
    depth: 2 # 0 means identity projection
    final_layer_norm: True
  action_encoder: 
    _target_: src.model.action.action_head.FourierActionEncoder
    action_dim: 48
    width: 1024
    time_cond: False
    enable_fourier_embed: False
    mlp_depth: 2 # 0 means no MLP
    fourier_embed_dim: 1024
    fourier_scale: 1.0
  action_decoder: 
    _target_: src.model.action.action_head.MLPProjector
    input_dim: 1024
    width: 1024
    output_dim: 48
    depth: 2 # 0 means identity projection
    final_layer_norm: False
  depth_encoder: 
    _target_: src.model.vlm.paligemma.depth_encoder.DINOv2DepthEncoder
    config: 
      model_name: "dinov2_vitb14_reg" # DINOv2 model: dinov2_vits14, dinov2_vitb14, dinov2_vitl14
      freeze_backbone: False  # Freeze DINOv2 backbone weights
      image_size: ${vision_resolution}
      patch_size: ${patch_size}
      output_dim: 768
      dinov2_repo_path: ${training.dinov2_repo_path}
      dinov2_model_path: ${training.dinov2_model_path}

  vision_tower:
    _target_: src.model.vlm.paligemma.siglip.SiglipVisionModel
    config:
      hidden_size: 1152 # siglip
      intermediate_size: 4304
      num_hidden_layers: 27
      num_attention_heads: 16
      num_channels: 3
      image_size: ${vision_resolution}
      patch_size: ${patch_size}
      layer_norm_eps: 1e-6
      attention_dropout: 0.0
      # Automatically calculate num_image_tokens based on resolution
      num_image_tokens: ${image_seq_len}
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
    use_quantize: ${quantize}
    use_lora: ${lora}

  multi_modal_projector:
    _target_: src.model.vlm.paligemma.siglip.PaliGemmaMultiModalProjector
    config:
      vision_config:
        hidden_size: ${eval:'${policy.depth_encoder.config.output_dim}+${policy.vision_tower.config.hidden_size}'} # 1152+768=1920
        projection_dim: ${mixture.vlm.hidden_size}  # Match VLM hidden size (2048 for paligemma, 2304 for paligemma2)
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
    use_quantize: ${quantize}
    use_lora: ${lora}

  joint_model:
    _target_: src.model.moe.joint_model.JointModel
    config:
      knowledge_insulation: True
      action_expert_adaptive_mode: ${action_expert_adaptive_mode}
      time_hidden_size: ${time_hidden_size}
      mixture: ${mixture}
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
      # Conditional layers based on vlm_backbone (paligemma: 18, paligemma2: 26)
      num_hidden_layers: ${eval:'26 if "${vlm_backbone}"=="paligemma2" else 18'}
      num_attention_heads: 8
      # Conditional KV heads (paligemma: 1, paligemma2: 4)
      num_key_value_heads: ${eval:'4 if "${vlm_backbone}"=="paligemma2" else 1'}
      # Conditional head_dim (paligemma: 2048/8=256, paligemma2: 2304/8=288)
      head_dim: ${eval:'288 if "${vlm_backbone}"=="paligemma2" else 256'}
      rms_norm_eps: 1e-6
      attention_bias: False
      attention_dropout: 0.1
      pad_token_id: ${pad_token_id}
  
  diffloss:
    _target_: src.model.action.diffloss.DiffLoss
    target_channels: 48  # TODO: set according to action dimension
    z_channels: ${mixture.vlm.hidden_size}
    depth: 3
    width: 1024
    num_sampling_steps: "100"
    grad_checkpointing: False
    # Note: DiffLoss uses standard DiT-style sinusoidal encoding (different from action expert)

logging:
  project: diffloss-compile
  entity: LegendaryVLA
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}
  tags: ["${name}", "${hydra:runtime.choices.experiment}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: eval_l1_loss
    mode: min
    k: 3
    format_str: update_step={update_step:04d}-eval_l1_loss={eval_l1_loss:.4f}
  save_last_ckpt: False
  save_last_snapshot: False

multi_run:
  # need to change to the correct path for multi-node training
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  job:
    override_dirname: ${name}
  run:
    # need to change to the correct path for multi-node training
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
