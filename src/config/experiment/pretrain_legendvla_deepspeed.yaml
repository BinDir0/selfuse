# @package _global_
name: legendvla
exp_name: "pretrain_deepspeed"
_target_: src.workspace.train_legendvla_deepspeed_workspace.TrainLegendVLAWorkspace
objective:  # ar, flow, or None(None means both)

action_expert_adaptive_mode: adaLN-Zero # adaLN, adaLN-Zero, or None
quantize: False
lora: False
lora_r: 32
lora_dropout: 0.0

image_shape: [224, 224, 3]
vla_dataset_paths:
#  - /share_data/datasets/taco/10episodes.zarr
 - /share_data/guantianrui/datasets/taco/taco_train_presence_clean.zarr
 - /share_data/guantianrui/datasets/OakInk-v2/oakink2_train_presence_clean.zarr
#  - /share_data/guantianrui/datasets/hoi4d_segmented/hoi4d_train.zarr
 - /share_data/yeyuyao/egodex_filter_train.zarr
vlm_dataset_paths:
 - "/share_data/guantianrui/datasets/VLM/FineVision/objects365_qa_filtered"  # localization & grounding
 - "/share_data/guantianrui/datasets/VLM/FineVision/spatialsense_filtered"  # spatialsense
 - "/share_data/guantianrui/datasets/VLM/FineVision/alfworldgpt_filtered"  # high level subtask action
 - "/share_data/guantianrui/datasets/VLM/FineVision/indoor_qa_filtered" 
 - "/share_data/guantianrui/datasets/VLM/FineVision/LLaVA_Instruct_150K_filtered" 
 - "/share_data/guantianrui/datasets/VLM/FineVision/cocoqa_filtered" 
 - "/share_data/guantianrui/datasets/VLM/FineVision/cambrian(filtered)_processed_filtered"
 - "/share_data/guantianrui/datasets/VLM/FineVision/lnqa_filtered"
 - "/share_data/guantianrui/datasets/VLM/FineVision/lrv_normal(filtered)_filtered"
 - "/share_data/guantianrui/datasets/VLM/FineVision/lvis_instruct4v_filtered"
 - "/share_data/guantianrui/datasets/VLM/FineVision/vqav2_filtered"
 - "/share_data/guantianrui/datasets/VLM/FineVision/sharegpt4v(llava)_filtered" 
 - "/share_data/guantianrui/datasets/VLM/FineVision/sharegpt4v(sam)_filtered" 
 - "/share_data/guantianrui/datasets/VLM/FineVision/textcaps_filtered" 
 - "/share_data/guantianrui/datasets/VLM/FineVision/image_textualization(filtered)_filtered" 

shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
    state:
      wrist:
        shape: [18]
      hand: 
        shape: [30]
      shape: [48]
      type: fingertips # fingertips or mano
      horizon: ${n_obs_state_steps}
  action:
    shape: [48]
    type: fingertips # fingertips or mano
    horizon: ${n_action_steps}

dataset:
  _target_: src.dataset.legendvla_dataset.LegendUnifiedDataset
  vla_dataset: 
    _target_: src.dataset.legendvla_dataset.LegendVLADataset
    zarr_paths: ${vla_dataset_paths}
    horizon: ${eval:'${n_action_steps}+${history}'}
    pad_before: ${eval:'${history}+${n_latency_steps}'}
    pad_after: ${eval:'${n_action_steps}-1'}
    shape_meta: ${shape_meta}
    seed: 42
    val_ratio: 0.005
    history: ${history} # frames
    objective: ${objective}
    normalizer_dataloader_cfg:
      batch_size: 4096
      num_workers: 192
      shuffle: False
      pin_memory: True
      persistent_workers: True
    use_relative_action: False
  vlm_dataset:
    _target_: src.dataset.legendvla_dataset.LegendVLMDataset
    dataset_paths: ${vlm_dataset_paths}
    split: train
    cache_dir: /share_data/guantianrui/datasets/VLM/FineVision/.cache
    seed: 42
    weights: [0.5, 0.5, 0.5]
    val_ratio: 0.005
  token_len_buckets: ${token_len_buckets}

history: 30
n_action_steps: 30
n_obs_image_steps: 1
n_obs_state_steps: 15
n_latency_steps: 0
# Make sure history is divisible by (n_obs_image_steps - 1) and (n_obs_state_steps - 1)

vla_processor: 
  _target_: src.dataset.paligemma_processing.PaliGemmaVLAProcessor
  tokenizer: 
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${training.pretrained_model_path}
    padding_side: right
  # motion_tokenizer: # FAST tokenizer
  #   states:
  #     _target_: src.model.action.fast_tokenizer.UniversalActionProcessor.from_pretrained
  #     pretrained_model_name_or_path: /share_data/chenzhang/tokenizers/FAST/taco-oakink/state20-2048action10-1024/states
  #   actions:
  #     _target_: src.model.action.fast_tokenizer.UniversalActionProcessor.from_pretrained
  #     pretrained_model_name_or_path: /share_data/chenzhang/tokenizers/FAST/taco-oakink/state20-2048action10-1024/actions
  motion_tokenizer: 
    states: 
      _target_: src.model.action.vq_tokenizer.VQActionProcessor.from_pretrained
      load_directory: /share_data/chenzhang/tokenizers/VQ/LegendVLA/2025.12.08/states # may need to change
    actions:
      _target_: src.model.action.vq_tokenizer.VQActionProcessor.from_pretrained
      load_directory: /share_data/chenzhang/tokenizers/VQ/LegendVLA/2025.12.08/actions # may need to change
  num_image_tokens: ${policy.vision_tower.config.num_image_tokens}
  max_seq_len: ${max_vlm_tokens}
  ignore_index: ${ignore_index}
  image_size: ${policy.vision_tower.config.image_size}
  tokenizer_padding: ${tokenizer_padding} 

vlm_processor: 
  _target_: src.dataset.paligemma_processing.PaliGemmaProcessor
  tokenizer: 
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${training.pretrained_model_path}
    padding_side: right
  num_image_tokens: ${policy.vision_tower.config.num_image_tokens}
  max_seq_len: ${max_vlm_tokens}
  ignore_index: ${ignore_index}
  image_size: ${policy.vision_tower.config.image_size}
  tokenizer_padding: ${tokenizer_padding} 

dataloader:
  batch_size: 8
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 8 # use the same batch size with training for best performance
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

flow: 
  sig_min: 0.001
  sampling: beta
  alpha: 1.5
  beta: 1
  num_inference_steps: 10

optimizer:
  action: 
    lr: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 1e-2
  vlm:
    lr: 4e-5 # We can try smaller learning rate than action for VLM
    betas: [0.9, 0.95]
    weight_decay: 1e-5

training:
  seed: 42
  objective: ${objective}
  debug: False
  profile: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  train_vlm: True
  init_motion_token_embeddings: True # initialize motion token embeddings
  load_pretrained_vlm_weights: True # load pretrained weights from VLM
  load_pretrained_pi05_weights: True # load pretrained weights from PI05
  pretrained_model_path: /share_data/chenzhang/checkpoints/paligemma-3b-pt-224
  pretrained_pi05_model_path: /share_data/chenzhang/checkpoints/pi05_base_pytorch # use pi05 checkpoint first
  resume_checkpoint_path: # /home/chenzhang/projects/EgoVLA/outputs/2025.10.14/13.54_legendvla_pretrain_legendvla_deepspeed/checkpoints/update_step=17500-eval_l1_loss=0.0522
  normalizer_path: /home/chenzhang/projects/EgoVLA/outputs/2025.12.08/11.53_vq_tokenizer_train_vq_tokenizer/normalizer.pkl
  num_epochs: 100
  use_bf16: True
  clipping:
    enabled: True
    max_grad_norm: 1.0
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  average:
    ema: 
      enabled: False
      decay: 0.99
      start: 2000 # start from 1st step
      freq: 1
      device: # not supported for specific device
    swa:
      enabled: False
      start: 100000
      freq: 100000
      device: # not supported for specific device
  # training loop control
  # in epochs
  ckpt_save_interval: 10000
  eval_every: 2500
  # make sure it is divisible by eval_every
  # cause we use eval_l1 loss to save topk checkpoint
  checkpoint_every: 2500 
  # steps per epoch
  max_train_steps: null
  max_eval_steps: null
  # evaluation settings
  eval_thresholds: [0.05, 0.1, 0.2, 0.3, 0.5] # Action accuracy thresholds for evaluation
  # misc
  tqdm_interval_sec: 1.0

mixture:
  # Note: Make sure the order of the mixtures is correct, i.e., vlm should be the first one, then action
  vlm:   # gemma
    hidden_size: 2048
    intermediate_size: 16384
    use_final_norm: True
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:  # not applicable for gemma
    rope_theta: 10000.0  # 10000 in gemma
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
    rope_theta: ${action_expert_rope_theta}

time_hidden_size: 1024 # only applicable if using adaptive
time_min_period: 0.004
time_max_period: 4.0
action_expert_rope_theta: 100.0   # since action/proprio seq_len is pretty small

# Fixed
ignore_index: -100
image_token_index: 257152
vocab_size: 257216
pad_token_id: 0
patch_size: 14
image_seq_len: ${eval:'(${image_shape[0]}//${patch_size})*(${image_shape[1]}//${patch_size})'}
state_seq_len: 192 # 
text_seq_len: ${eval:'${state_seq_len}+64'}
answer_seq_len: 256 
# Make sure at least one tokens for VLM answer in the training, 
# otherwise it will cause error(the VLM parameters may have no gradient, then it will cause error in all-reduce stage)
max_vlm_tokens: ${eval:'${image_seq_len}*${shape_meta.obs.rgb.horizon}+${text_seq_len}+${answer_seq_len}'} 
tokenizer_padding: longest # longest or max_length
# when we use longest, we set several discrete buckets of token_len for the VLM tokens
token_len_buckets: [512, 576, 640, 704, '${max_vlm_tokens}']

policy: 
  _target_: src.policy.legendvla.LegendVLA
  cfg: 
    vocab_size: ${vocab_size}
    pad_token_id: ${pad_token_id}
    ignore_index: ${ignore_index}
    image_token_index: ${image_token_index}
    use_lm_head: True
    max_vlm_tokens: ${max_vlm_tokens}
    num_inference_steps: ${flow.num_inference_steps}
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    time_min_period: ${time_min_period}
    time_max_period: ${time_max_period}
    flow_sig_min: ${flow.sig_min}
    # Add pretrained_model_path for loading pre-trained VLM weights
    pretrained_model_path: ${training.pretrained_model_path}
    pretrained_pi05_model_path: ${training.pretrained_pi05_model_path}
    # Depth image support
    use_depth: True  # Enable depth image processing with DINOv2
    depth_model_name: "dinov2_vitb14"  # DINOv2 model: dinov2_vits14, dinov2_vitb14, dinov2_vitl14
    freeze_depth_encoder: True  # Freeze DINOv2 backbone weights
    loss_weights: 
      ce_loss_weight: 1.0
      flow_loss_weight: 5.0
  shape_meta: ${shape_meta}
  vision_tower:
    _target_: src.model.vlm.paligemma.siglip.SiglipVisionModel
    config:
      hidden_size: 1152 # siglip
      intermediate_size: 4304
      num_hidden_layers: 27
      num_attention_heads: 16
      num_channels: 3
      image_size: 224
      patch_size: 14
      layer_norm_eps: 1e-6
      attention_dropout: 0.0
      num_image_tokens: 256
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
    use_quantize: ${quantize}
    use_lora: ${lora}

  multi_modal_projector:
    _target_: src.model.vlm.paligemma.siglip.PaliGemmaMultiModalProjector
    config:
      vision_config:
        hidden_size: 1152
        projection_dim: 2048
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
    use_quantize: ${quantize}
    use_lora: ${lora}

  joint_model:
    _target_: src.model.moe.joint_model.JointModel
    config:
      knowledge_insulation: True
      action_expert_adaptive_mode: ${action_expert_adaptive_mode}
      time_hidden_size: ${time_hidden_size}
      mixture: ${mixture}
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
      num_hidden_layers: 18
      num_attention_heads: 8
      num_key_value_heads: 1
      head_dim: 256
      rms_norm_eps: 1e-6
      attention_bias: False
      attention_dropout: 0.1
      pad_token_id: ${pad_token_id}

logging:
  project: train_legendvla_deepspeed
  entity: LegendaryVLA
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}
  tags: ["${name}", "${hydra:runtime.choices.experiment}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: eval_l1_loss
    mode: min
    k: 3
    format_str: update_step={update_step:04d}-eval_l1_loss={eval_l1_loss:.4f}
  save_last_ckpt: False
  save_last_snapshot: False

multi_run:
  # need to change to the correct path for multi-node training
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${hydra:runtime.choices.experiment}

hydra:
  job:
    override_dirname: ${name}
  run:
    # need to change to the correct path for multi-node training
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${hydra:runtime.choices.experiment}
    subdir: ${hydra.job.num}
