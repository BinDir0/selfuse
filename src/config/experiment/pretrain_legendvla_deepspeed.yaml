#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/textcaps_filtered" 
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/image_textualization(filtered)_filtered" 
#  - "/share_data/guantianrui/datasets/VLM/FineVision_Arrow_Format/aguvis-stage-1"
