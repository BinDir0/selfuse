# @package _global_
name: legendvla
exp_name: "pretrain_legendvla_deepspeed"
_target_: src.workspace.train_legendvla_deepspeed_workspace.TrainLegendVLAWorkspace
objective:  # ar, flow, or None(None means both)

action_expert_adaptive_mode: adaLN-Zero # adaLN, adaLN-Zero, or None
quantize: False
lora: False
lora_r: 32
lora_dropout: 0.0

# Vision backbone configuration
vlm_backbone: paligemma  # Options: paligemma, paligemma2
vision_resolution: 224  # Options: 224 or 448
image_shape:
  - ${vision_resolution}
  - ${vision_resolution}
  - 3
depth_image_shape:
  - ${vision_resolution}
  - ${vision_resolution}

human_dataset_mapping: 
  image: image
  depth: depth
  wrist_state: state/wrist
  hand_state: state/fingertips
  wrist_action: action/wrist
  hand_action: action/fingertips
  extrinsic: extrinsic
  intrinsic: intrinsic
  instruction: instruction
  instruction_num: instruction_num
real_world_dataset_mapping: 
  image: image-head
  depth: depth-head
  wrist_state: state/wrist-head
  hand_state: state/fingertips-head
  wrist_action: action/wrist-head
  hand_action: action/fingertips-head
  extrinsic: extrinsic
  intrinsic: intrinsic/head
  instruction: instruction
  instruction_num: instruction_num

vla_dataset_paths:
 - name: dexterous_grasping
   path: /share_data/yanruilin/complete_data/Dexterous_grasping.zarr
