# @package _global_
name: legendvla
exp_name: "test_legendvla"

# Model configuration
action_expert_adaptive_mode:  # adaLN, adaLN-Zero, or None
quantize: False
lora: False
lora_r: 32
lora_dropout: 0.0

# Data configuration
image_shape: [224, 224, 3]
vla_dataset_paths:
 - /mnt/disk0/fanlian/datasets/taco_test_seen.zarr
 - /mnt/disk0/fanlian/datasets/taco_test_unseen_task.zarr
 - /mnt/disk0/fanlian/datasets/oakink2_test_seen.zarr
 - /mnt/disk0/fanlian/datasets/oakink2_test_unseen_task.zarr
 - /mnt/disk0/fanlian/datasets/hoi4d_test_seen.zarr
 - /mnt/disk0/fanlian/datasets/hoi4d_test_unseen_object.zarr
 - /mnt/disk0/fanlian/datasets/hoi4d_test_unseen_room_layout.zarr
 - /mnt/disk0/fanlian/datasets/egodex_test_seen.zarr
 - /mnt/disk0/fanlian/datasets/egodex_test_unseen_task.zarr


# Shape metadata
shape_meta: &shape_meta
  obs:
    rgb:
      shape: ${image_shape}
      type: rgb
      horizon: ${n_obs_image_steps}
    state:
      wrist:
        shape: [18]
      hand: 
        shape: [30]
      shape: [48]
      type: keypoint
      horizon: ${n_obs_state_steps}
  action:
    shape: [48]
    type: keypoint
    horizon: ${n_action_steps}

# Dataset configuration
dataset:
  _target_: src.dataset.legendvla_dataset.LegendUnifiedDataset
  vla_dataset: 
    _target_: src.dataset.legendvla_dataset.LegendVLADataset
    zarr_paths: ${vla_dataset_paths}
    horizon: ${eval:'${n_action_steps}+${history}'}
    pad_before: ${eval:'${history}+${n_latency_steps}'}
    pad_after: ${eval:'${n_action_steps}-1'}
    shape_meta: ${shape_meta}
    seed: 42
    val_ratio: 0.001
    history: ${history}
    normalizer_dataloader_cfg:
      batch_size: 4096
      num_workers: 96
      shuffle: False
      pin_memory: True
      persistent_workers: True
  token_len_buckets: ${token_len_buckets}

# Sequence configuration
history: 30
n_action_steps: 30
n_obs_image_steps: 1
n_obs_state_steps: 1
n_latency_steps: 0

# Processor configuration
processor: 
  fast_tokenizer_path: /mnt/disk0/fanlian/tokenizers/fast_tokenizer
  hand_states_tokenizer_path: /mnt/disk0/fanlian/tokenizers/vq_tokenizer/states
  hand_actions_tokenizer_path: /mnt/disk0/fanlian/tokenizers/vq_tokenizer/actions
  hand_tokenizer_type: 'vq' # 'vq' or 'fast'

# Flow matching configuration
flow: 
  sig_min: 0.001
  sampling: beta
  alpha: 1.5
  beta: 1
  num_inference_steps: 10

# Model architecture parameters
time_hidden_size: 256
time_max_period: 100.0
action_expert_rope_theta: 100.0

# Fixed model parameters
ignore_index: -100
image_token_index: 257152
vocab_size: 257216
pad_token_id: 0
patch_size: 14
image_seq_len: ${eval:'(${image_shape[0]}//${patch_size})*(${image_shape[1]}//${patch_size})'}
state_seq_len: 192
text_seq_len: ${eval:'${state_seq_len}+64'}
answer_seq_len: 256
max_vlm_tokens: ${eval:'${image_seq_len}*${shape_meta.obs.rgb.horizon}+${text_seq_len}+${answer_seq_len}'} 
tokenizer_padding: max_length
token_len_buckets: [512, 576, 640, 704, '${max_vlm_tokens}']

# Model mixture configuration
mixture:
  vlm:
    hidden_size: 2048
    intermediate_size: 16384
    use_final_norm: False
    cache: True
    use_quantize: ${quantize}
    use_lora: ${lora}
    adaptive_mode:
    rope_theta: 10000.0
  action:
    hidden_size: 1024
    intermediate_size: 4096
    use_final_norm: True
    cache: False
    use_quantize: False
    use_lora: False
    adaptive_mode: ${action_expert_adaptive_mode}
    rope_theta: ${action_expert_rope_theta}

# Policy configuration
policy: 
  _target_: src.policy.legendvla.LegendVLA
  cfg: 
    vocab_size: ${vocab_size}
    pad_token_id: ${pad_token_id}
    ignore_index: ${ignore_index}
    image_token_index: ${image_token_index}
    use_lm_head: True
    max_vlm_tokens: ${max_vlm_tokens}
    num_inference_steps: ${flow.num_inference_steps}
    action_expert_adaptive_mode: ${action_expert_adaptive_mode}
    time_hidden_size: ${time_hidden_size}
    time_max_period: ${time_max_period}
    flow_sig_min: ${flow.sig_min}
    # Add pretrained_model_path for loading pre-trained VLM weights
    pretrained_model_path: /mnt/disk0/fanlian/pretrained_vlm/paligemma-3b-pt-224
    loss_weights: 
      ce_loss_weight: 1.0
      flow_loss_weight: 10.0
  shape_meta: ${shape_meta}
  vision_tower:
    _target_: src.model.vlm.paligemma.siglip.SiglipVisionModel
    config:
      hidden_size: 1152
      intermediate_size: 4304
      num_hidden_layers: 27
      num_attention_heads: 16
      num_channels: 3
      image_size: 224
      patch_size: 14
      layer_norm_eps: 1e-6
      attention_dropout: 0.0
      num_image_tokens: 256
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
    use_quantize: ${quantize}
    use_lora: ${lora}

  multi_modal_projector:
    _target_: src.model.vlm.paligemma.siglip.PaliGemmaMultiModalProjector
    config:
      vision_config:
        hidden_size: 1152
        projection_dim: 2048
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
    use_quantize: ${quantize}
    use_lora: ${lora}

  joint_model:
    _target_: src.model.moe.joint_model.JointModel
    config:
      knowledge_insulation: True
      action_expert_adaptive_mode: ${action_expert_adaptive_mode}
      time_hidden_size: ${time_hidden_size}
      mixture: ${mixture}
      lora:
        r: ${lora_r}
        dropout: ${lora_dropout}
      num_hidden_layers: 18
      num_attention_heads: 8
      num_key_value_heads: 1
      head_dim: 256
      rms_norm_eps: 1e-6
      attention_bias: False
      attention_dropout: 0.0
      pad_token_id: ${pad_token_id}

# Testing configuration
testing:
  seed: 42
  checkpoint_path: /mnt/disk0/fanlian/checkpoints/mp_rank_00_model_states.pt
  device: auto
  normalizer_path: /mnt/disk0/fanlian/normalizer/normalizer.pkl
  num_samples: 5
  mano_root_dir: /home/fanlian/mano_v1_2/models
  fps: 30
  output_dir: /mnt/disk0/fanlian/visualize
  video_name: visualize.mp4
  video_3d_name: visualize_3d.mp4
  show_mesh: True
  mesh_alpha: 0.5
  show_gt: True
  target_width: 1920
  target_height: 1080
  visualize_type: 'keypoint' # mesh or skeleton or tokenizer
  tokenizer_type: 'vq' # vq or fast
