# @package _global_

world_model:
  enabled: true
  ff_token: "<future_frame>"

  # The target encoder (self_vit EMA) receives obs+future frames as a
  # combined temporal sequence on GPU. MEM temporal causal attention
  # allows future frames to attend to observation frames.
  # IMPORTANT: Both the observation frame count (data.shape_meta.obs.rgb.horizon)
  # and future_frame.horizon must each be divisible by Qwen3-VL's
  # temporal_patch_size (2) so that the obs/future feature split after
  # the ViT spatial merger aligns cleanly with temporal patch boundaries.
  future_frame:
    horizon: 2     # must be divisible by temporal_patch_size (2)
    stride: 30

  ff_noise_std: 0.02

  mem_temporal_attention:
    enabled: true
    every_n_layers: 4
    max_temporal_len: 32
    sinusoidal_pe_base: 10000.0

  target_encoder:
    _target_: src.model.vision.future_frame_encoder.FutureFrameTargetEncoder
    encoder_type: self_vit
    feature_dim: ${dims.vlm_hidden_size}
    use_ema: true
    model_name_or_path: ""
  ema_momentum: 0.996

  wm_condition_projector:
    _target_: src.model.action.action_head.MLPProjector
    input_dim: ${dims.vlm_hidden_size}
    output_dim: ${dims.diffloss_z_channels}
    width: ${dims.vlm_hidden_size}
    depth: 2
    final_layer_norm: false
  wm_diffloss:
    _target_: src.model.common.diffloss.DiffLoss
    target_channels: ${dims.vlm_hidden_size}
    z_channels: ${dims.diffloss_z_channels}
    depth: 4
    width: 2048
    num_sampling_steps: "100"
    use_flow_matching: true
    flow_sig_min: ${flow.sig_min}
    num_inference_steps: ${flow.num_inference_steps}
    cond_dropout_prob: 0.1
  loss_weight: 1.0
