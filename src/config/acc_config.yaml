compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  # need to change to the correct path
  deepspeed_config_file: src/config/ds_config.json
  # need to change to the correct path
  deepspeed_hostfile: src/config/hostfile
  deepspeed_multinode_launcher: pdsh
distributed_type: DEEPSPEED
downcast_bf16: 'no'
dynamo_config:
  dynamo_backend: INDUCTOR
enable_cpu_affinity: false
machine_rank: 0
main_process_ip: 172.18.1.114 # need to change to the main process ip
main_process_port: 11451 # need to change to the main process port
main_training_function: main
num_machines: 5 # need to change to the correct number
num_processes: 40 # need to change to the correct number, sum of gpus of all nodes
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
