dataset:
  adapter: legacy_buildai
  source_id: legacy_buildai_100k
  split: train
  start_factory_id: 1
  end_factory_id: 85

paths:
  processed_root: /share_data/lvjianan/datasets/BuildAI-processed
  annotation_root: /share_data/guantianrui/datasets/BuildAI-100K-annotations
  final_dataset_root: /share_data/guantianrui/datasets/BuildAI-100K-legacy-vla
  log_root: /share_data/guantianrui/dataset_pipeline_logs

runtimes:
  hawor_python: /share_data/guantianrui/environment/anaconda3/envs/hawor/bin/python3.10
  slam_python: /share_data/guantianrui/environment/anaconda3/envs/any4/bin/python3.10

infer:
  common:
    gpus: 0,1,2,3
    workers_per_gpu: 1
    resume: true
    checkpoint: /share_data/guantianrui/webhaworset/facHaWoRy/weights/hawor/checkpoints/hawor.ckpt
    infiller_weight: /share_data/guantianrui/webhaworset/facHaWoRy/weights/hawor/checkpoints/infiller.pt
  detect_motion:
    chunk_batch_size: 64
    num_workers: 16
    detect_batch_size: 128
    detect_io_workers: 8
  slam:
    any4d_batch_size: 32
    depth_predict_all_frames: true
  infiller:
    infiller_window_batch_size: 64

annotation:
  command: >
    echo "Read {manifest} and write {annotation_root}/<clip_id>.annotation.json"

filter:
  stages: detect_track,motion,slam,infiller
  workers: 8
  drop_nonfinite_world_res: true
  drop_nonfinite_slam: true
  # Optional thresholds:
  # max_hand_translation_step: 0.35
  # max_camera_translation_step: 0.5
  # max_camera_rotation_step: 1.0

build:
  require_annotation: false
  preprocess_workers: 8
  writer_workers: 4
  frames_per_shard: 10000
  repeat_episodes: 1
  mano_device: cuda:0
  source_fps: 5.0
  target_fps: 30.0
  interpolate_labels: true

validation:
  max_clips: 200
  dataset_sample_checks: 20
