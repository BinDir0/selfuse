dataset:
  adapter: buildai
  source_id: buildai_100k_v9_30fps_part1
  split: train
  start_factory_id: 1
  end_factory_id: 238

paths:
  shard_root: /share_data/guantianrui/datasets/Egocentric-100K/processed_v9_30fps_jpg
  seq_folder_root: /share_data/guantianrui/datasets/Egocentric-100K/processed_v9_test_jpg
  annotation_root: /share_data/lvjianan/LegendaryVLA/buildai_processing/qwen_results/annotations_qwen3.5-plus
  final_dataset_root: /share_data/guantianrui/datasets/Egocentric-100K/BuildAI-100k-part1
  log_root: /share_data/guantianrui/dataset_pipeline_logs

runtimes:
  hawor_python: /share_data/guantianrui/environment/anaconda3/envs/hawor/bin/python3.10
  slam_python: /share_data/guantianrui/environment/anaconda3/envs/any4d/bin/python3.10

infer:
  common:
    gpus: 0,1,2,3
    workers_per_gpu: 1
    resume: true
    checkpoint: /share_data/guantianrui/webhaworset/facHaWoRy/weights/hawor/checkpoints/hawor.ckpt
    infiller_weight: /share_data/guantianrui/webhaworset/facHaWoRy/weights/hawor/checkpoints/infiller.pt
  detect_motion:
    chunk_batch_size: 64
    num_workers: 16
    detect_batch_size: 128
    detect_io_workers: 8
  slam:
    any4d_batch_size: 32
    depth_predict_all_frames: true
  infiller:
    infiller_window_batch_size: 64

annotation:
  command: >
    echo "Read {prepared_state} and write {annotation_root}/<clip_id>_qwen-annotation.json"

filter:
  stages: detect_track,motion,slam,infiller
  workers: 8
  # Optional thresholds:
  # max_hand_translation_step: 0.35
  # max_camera_translation_step: 0.5
  # max_camera_rotation_step: 1.0

build:
  require_annotation: true
  annotation_suffix: _qwen-annotation.json
  preprocess_workers: 8
  writer_workers: 4
  frames_per_shard: 10000
  repeat_episodes: 1
  mano_device: cuda:0
  source_fps: 5.0
  target_fps: 30.0
  interpolate_labels: true
  export_depth: true

validation:
  max_clips: 200
  dataset_sample_checks: 20
