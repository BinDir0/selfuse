dataset:
  adapter: video_folder
  source_id: demo_videos
  split: train

adapter_config:
  video_root: /share_data/example/videos
  frames_root: /share_data/example/videos
  frame_subdir: extracted_images
  seq_folder_root: /share_data/example/video_outputs

paths:
  annotation_root: /share_data/example/video_annotations
  final_dataset_root: /share_data/example/final_vla_dataset
  log_root: /share_data/example/dataset_pipeline_logs

runtimes:
  hawor_python: /path/to/hawor/bin/python
  slam_python: /path/to/any4d/bin/python

infer:
  common:
    gpus: 0
    workers_per_gpu: 1
    resume: true
  detect_motion: {}
  slam: {}
  infiller: {}

annotation:
  command: >
    echo "Read {manifest} and write {annotation_root}/<clip_id>.annotation.json"

build:
  require_annotation: true
  preprocess_workers: 8
  writer_workers: 4
  frames_per_shard: 10000
  repeat_episodes: 1
  mano_device: cuda:0
  source_fps: 30.0
  target_fps: 30.0
  interpolate_labels: false

validation:
  max_clips: 100
  dataset_sample_checks: 20
