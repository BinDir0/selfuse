dataset:
  adapter: legacy_buildai
  source_id: legacy_buildai_100k
  split: train
  start_factory_id: 1
  end_factory_id: 85

paths:
  processed_root: /share_data/lvjianan/datasets/BuildAI-processed
  annotation_root: /share_data/example/legacy_buildai_annotations
  final_dataset_root: /share_data/example/legacy_buildai_vla
  log_root: /share_data/example/dataset_pipeline_logs

runtimes:
  hawor_python: /path/to/hawor/bin/python
  slam_python: /path/to/any4d/bin/python

infer:
  common:
    gpus: 0,1,2,3
    workers_per_gpu: 1
    resume: true
    checkpoint: /path/to/hawor.ckpt
    infiller_weight: /path/to/infiller.pt
  detect_motion: {}
  slam: {}
  infiller: {}

annotation:
  command: >
    echo "Read {manifest} and write {annotation_root}/<clip_id>.annotation.json"

filter:
  stages: detect_track,motion,slam,infiller
  workers: 8

build:
  require_annotation: false
  preprocess_workers: 8
  writer_workers: 4
  frames_per_shard: 10000
  repeat_episodes: 1
  mano_device: cuda:0
  source_fps: 5.0
  target_fps: 30.0
  interpolate_labels: true

validation:
  max_clips: 100
  dataset_sample_checks: 20
