# Configuration for the fork-vs-upstream HaWoR comparison.
# Fill the production-machine paths before running there. Office machine has no data.

work_dir: /efs-exp/guantianrui/eval_compare_work   # big disk: prepared inputs, predictions, results all land here (keep off /root)
subset_per_dataset: 10               # sequences sampled per dataset
seed: 0                              # deterministic sequence sampling

# 100-frame segments + 1-frame RPE delta == HaWoR paper defaults.
wa_segment: 100
rpe_delta: 1

repos:
  fork: .                            # this repo (run from its root)
  upstream: /root/HaWoR              # reference HaWoR

# env vars exported before each system's inference command (paths/large-disk tmp roots).
fork_env:
  HAWOR_BATCH_TMPDIR: /efs-exp/guantianrui/tmp2   # SLAM stage3 frame-materialization workspace
orig_env: {}

# conda envs used by the runners (set to "" to skip activation).
# fork and orig run in SEPARATE envs: the upstream /root/HaWoR uses DROID-SLAM/lietorch
# (built against its own torch), incompatible with the fork's env.
envs:
  fork: hawor                        # env for THIS repo's dataset pipeline
  orig: hawor_orig                   # env where /root/HaWoR demo.py runs (DROID-SLAM/lietorch OK)
  any4d: any4d

datasets:
  egoverse:
    enabled: false                                 # dropped: episodes are zarr v3, hawor env ships zarr v2 (incompatible)
    data_root: /efs-exp/guantianrui/eval/egoverse  # episode dirs (zarr v3 groups, no .zarr suffix)
    split_file: null
  h2o:
    enabled: true
    data_root: /efs-exp/guantianrui/datasets/H2O   # has subjectN_ego_v1_1/subjectN_ego/<scene>/<seq>/cam4/
    split_file: null                               # null => recursively enumerate cam4/rgb dirs (no pose list needed)
  oakink2:
    enabled: true
    data_root: /efs-exp/guantianrui/datasets/OakInk-v2  # ROOT with data/ (per-seq .tar or extracted) + anno_preview/
    split_file: null
    ego_cam: egocentric                            # camera-LAYOUT name; serial auto-resolved via cam_def
  taco:
    enabled: true
    data_root: /path/to/TACO                       # ROOT with Egocentric_RGB_Videos/, Egocentric_Camera_Parameters/, Hand_Poses/
    split_file: null                               # null => enumerate Hand_Poses/<triplet>/<seq> from disk (no toolkit list needed)
    trans_unit: 1.0                                # confirmed metres by convert_taco_to_wds.py
