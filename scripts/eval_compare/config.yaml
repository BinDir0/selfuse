# Configuration for the fork-vs-upstream HaWoR comparison.
# Fill the production-machine paths before running there. Office machine has no data.

work_dir: ./eval_compare_work        # prepared inputs, predictions, results land here
subset_per_dataset: 10               # sequences sampled per dataset
seed: 0                              # deterministic sequence sampling

# 100-frame segments + 1-frame RPE delta == HaWoR paper defaults.
wa_segment: 100
rpe_delta: 1

repos:
  fork: .                            # this repo (run from its root)
  upstream: /root/HaWoR              # reference HaWoR

# conda envs used by the runners (set to "" to skip activation)
envs:
  hawor: hawor
  any4d: any4d

datasets:
  egoverse:
    enabled: true
    data_root: /root/datasets/EgoVerse/data        # <-- production zarr root
    split_file: null
  h2o:
    enabled: true
    data_root: /efs-exp/guantianrui/datasets/H2O   # has subjectN_ego_v1_1/subjectN_ego/<scene>/<seq>/cam4/
    split_file: null                               # null => recursively enumerate cam4/rgb dirs (no pose list needed)
  oakink2:
    enabled: true
    data_root: /path/to/OakInk2                    # ROOT with data/ + anno_preview/ + program/
    split_file: null
    ego_cam: egocentric                            # camera-LAYOUT name; serial auto-resolved via cam_def
  taco:
    enabled: true
    data_root: /path/to/TACO                       # ROOT with Egocentric_RGB_Videos/, Egocentric_Camera_Parameters/, Hand_Poses/
    split_file: null                               # null => enumerate Hand_Poses/<triplet>/<seq> from disk (no toolkit list needed)
    trans_unit: 1.0                                # confirmed metres by convert_taco_to_wds.py
